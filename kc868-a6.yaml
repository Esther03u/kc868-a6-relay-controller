########################################################################
# KinCony KC868-A6 — 6-Relay MQTT Controller
#
# - Board:     KinCony KC868-A6 (ESP32, PCF8574 I/O expander, RTC)
# - Framework: ESPHome (esp-idf)
# - Control:   MQTT (ON / OFF / TOGGLE) + per-relay ON/OFF time schedule
#
# Pin map source: https://devices.esphome.io/devices/kincony-kc868-a6/
#
# MQTT broker: using the public test.mosquitto.org broker (no login needed
# on port 1883). It's unauthenticated and shared by anyone in the world,
# so mqtt_prefix below MUST stay unique — do not shorten it to something
# generic like "kc868-a6" or strangers on the broker could control your
# relays. Switch to a private broker later by changing mqtt_broker in
# secrets.yaml (see docker-compose.yml for a ready-to-run private option).
#
# Commands — one topic per relay per action, payload mostly ignored
# (send any payload, e.g. "1") except where noted:
#   ${mqtt_prefix}/cmd/relay/<n>/toggle
#   ${mqtt_prefix}/cmd/relay/<n>/on
#   ${mqtt_prefix}/cmd/relay/<n>/off
#   ${mqtt_prefix}/cmd/relay/<n>/on_time      payload = minutes since midnight, e.g. "420"
#   ${mqtt_prefix}/cmd/relay/<n>/off_time     payload = minutes since midnight
#   ${mqtt_prefix}/cmd/relay/<n>/sched_enable payload = "ON" / "OFF"
#
# States — mirrors the command topics under state/, retained:
#   ${mqtt_prefix}/state/relay/<n>/status        "ON" / "OFF"
#   ${mqtt_prefix}/state/relay/<n>/on_time
#   ${mqtt_prefix}/state/relay/<n>/off_time
#   ${mqtt_prefix}/state/relay/<n>/sched_enable  "ON" / "OFF"
#   ${mqtt_prefix}/status                        "online" / "offline"
########################################################################

substitutions:
  mqtt_prefix: "pkru/19_04_10_28"

esphome:
  name: kc868-a6
  friendly_name: "KC868-A6 Relay Controller"
  comment: "6-channel MQTT relay controller (KinCony KC868-A6)"

esp32:
  variant: esp32
  framework:
    type: esp-idf

# --------------------------------------------------------------------
# Networking
# --------------------------------------------------------------------
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Fallback hotspot if WiFi connection fails, so the board is always reachable
  ap:
    ssid: "KC868-A6 Fallback"
    password: !secret ap_fallback_password

captive_portal:

logger:
  level: INFO

# Native ESPHome API (Home Assistant) — optional but handy for debugging
api:
  encryption:
    key: !secret encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

# Built-in web UI on the board itself (http://kc868-a6.local) — quick fallback
# dashboard in addition to the custom PWA dashboard in /dashboard.
web_server:
  port: 80
  version: 3

# --------------------------------------------------------------------
# MQTT — this is the core control channel (requirement 1)
# --------------------------------------------------------------------
mqtt:
  broker: !secret mqtt_broker
  port: 1883
  # test.mosquitto.org's plain port 1883 is unauthenticated, so no
  # username/password here. If you switch to a private/authenticated
  # broker later, add them back:
  #   username: !secret mqtt_username
  #   password: !secret mqtt_password
  topic_prefix: ${mqtt_prefix}
  discovery: false
  # Publish every state change as a retained message so dashboards/apps
  # immediately see the correct status on connect/reload.
  birth_message:
    topic: ${mqtt_prefix}/status
    payload: online
    retain: true
  will_message:
    topic: ${mqtt_prefix}/status
    payload: offline
    retain: true
  shutdown_message:
    topic: ${mqtt_prefix}/status
    payload: offline
    retain: true
  # One command topic per relay per action — see the header comment above
  # for the full list. Each relay repeats the same six triggers.
  on_message:
    - topic: ${mqtt_prefix}/cmd/relay/1/toggle
      then:
        - switch.toggle: relay_1
    - topic: ${mqtt_prefix}/cmd/relay/1/on
      then:
        - switch.turn_on: relay_1
    - topic: ${mqtt_prefix}/cmd/relay/1/off
      then:
        - switch.turn_off: relay_1
    - topic: ${mqtt_prefix}/cmd/relay/1/on_time
      then:
        - number.set:
            id: on_time_1
            value: !lambda 'return parse_number<int>(x).value_or(-1);'
    - topic: ${mqtt_prefix}/cmd/relay/1/off_time
      then:
        - number.set:
            id: off_time_1
            value: !lambda 'return parse_number<int>(x).value_or(-1);'
    - topic: ${mqtt_prefix}/cmd/relay/1/sched_enable
      then:
        - if:
            condition:
              lambda: 'return x == "ON";'
            then:
              - switch.turn_on: sched_enable_1
            else:
              - switch.turn_off: sched_enable_1

    - topic: ${mqtt_prefix}/cmd/relay/2/toggle
      then:
        - switch.toggle: relay_2
    - topic: ${mqtt_prefix}/cmd/relay/2/on
      then:
        - switch.turn_on: relay_2
    - topic: ${mqtt_prefix}/cmd/relay/2/off
      then:
        - switch.turn_off: relay_2
    - topic: ${mqtt_prefix}/cmd/relay/2/on_time
      then:
        - number.set:
            id: on_time_2
            value: !lambda 'return parse_number<int>(x).value_or(-1);'
    - topic: ${mqtt_prefix}/cmd/relay/2/off_time
      then:
        - number.set:
            id: off_time_2
            value: !lambda 'return parse_number<int>(x).value_or(-1);'
    - topic: ${mqtt_prefix}/cmd/relay/2/sched_enable
      then:
        - if:
            condition:
              lambda: 'return x == "ON";'
            then:
              - switch.turn_on: sched_enable_2
            else:
              - switch.turn_off: sched_enable_2

    - topic: ${mqtt_prefix}/cmd/relay/3/toggle
      then:
        - switch.toggle: relay_3
    - topic: ${mqtt_prefix}/cmd/relay/3/on
      then:
        - switch.turn_on: relay_3
    - topic: ${mqtt_prefix}/cmd/relay/3/off
      then:
        - switch.turn_off: relay_3
    - topic: ${mqtt_prefix}/cmd/relay/3/on_time
      then:
        - number.set:
            id: on_time_3
            value: !lambda 'return parse_number<int>(x).value_or(-1);'
    - topic: ${mqtt_prefix}/cmd/relay/3/off_time
      then:
        - number.set:
            id: off_time_3
            value: !lambda 'return parse_number<int>(x).value_or(-1);'
    - topic: ${mqtt_prefix}/cmd/relay/3/sched_enable
      then:
        - if:
            condition:
              lambda: 'return x == "ON";'
            then:
              - switch.turn_on: sched_enable_3
            else:
              - switch.turn_off: sched_enable_3

    - topic: ${mqtt_prefix}/cmd/relay/4/toggle
      then:
        - switch.toggle: relay_4
    - topic: ${mqtt_prefix}/cmd/relay/4/on
      then:
        - switch.turn_on: relay_4
    - topic: ${mqtt_prefix}/cmd/relay/4/off
      then:
        - switch.turn_off: relay_4
    - topic: ${mqtt_prefix}/cmd/relay/4/on_time
      then:
        - number.set:
            id: on_time_4
            value: !lambda 'return parse_number<int>(x).value_or(-1);'
    - topic: ${mqtt_prefix}/cmd/relay/4/off_time
      then:
        - number.set:
            id: off_time_4
            value: !lambda 'return parse_number<int>(x).value_or(-1);'
    - topic: ${mqtt_prefix}/cmd/relay/4/sched_enable
      then:
        - if:
            condition:
              lambda: 'return x == "ON";'
            then:
              - switch.turn_on: sched_enable_4
            else:
              - switch.turn_off: sched_enable_4

    - topic: ${mqtt_prefix}/cmd/relay/5/toggle
      then:
        - switch.toggle: relay_5
    - topic: ${mqtt_prefix}/cmd/relay/5/on
      then:
        - switch.turn_on: relay_5
    - topic: ${mqtt_prefix}/cmd/relay/5/off
      then:
        - switch.turn_off: relay_5
    - topic: ${mqtt_prefix}/cmd/relay/5/on_time
      then:
        - number.set:
            id: on_time_5
            value: !lambda 'return parse_number<int>(x).value_or(-1);'
    - topic: ${mqtt_prefix}/cmd/relay/5/off_time
      then:
        - number.set:
            id: off_time_5
            value: !lambda 'return parse_number<int>(x).value_or(-1);'
    - topic: ${mqtt_prefix}/cmd/relay/5/sched_enable
      then:
        - if:
            condition:
              lambda: 'return x == "ON";'
            then:
              - switch.turn_on: sched_enable_5
            else:
              - switch.turn_off: sched_enable_5

    - topic: ${mqtt_prefix}/cmd/relay/6/toggle
      then:
        - switch.toggle: relay_6
    - topic: ${mqtt_prefix}/cmd/relay/6/on
      then:
        - switch.turn_on: relay_6
    - topic: ${mqtt_prefix}/cmd/relay/6/off
      then:
        - switch.turn_off: relay_6
    - topic: ${mqtt_prefix}/cmd/relay/6/on_time
      then:
        - number.set:
            id: on_time_6
            value: !lambda 'return parse_number<int>(x).value_or(-1);'
    - topic: ${mqtt_prefix}/cmd/relay/6/off_time
      then:
        - number.set:
            id: off_time_6
            value: !lambda 'return parse_number<int>(x).value_or(-1);'
    - topic: ${mqtt_prefix}/cmd/relay/6/sched_enable
      then:
