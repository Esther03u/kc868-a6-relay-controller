# --------------------------------------------------------------------
# Time — needed for the scheduling feature
# --------------------------------------------------------------------
time:
  - platform: sntp
    id: sntp_time
    timezone: "Asia/Bangkok"

# --------------------------------------------------------------------
# Buses (from official KC868-A6 pin map)
# --------------------------------------------------------------------
i2c:
  sda: GPIO4
  scl:
    number: GPIO15
    ignore_strapping_warning: true

uart:
  - id: rs485
    tx_pin: GPIO27
    rx_pin: GPIO14
    baud_rate: 9600
  - id: rs232
    tx_pin: GPIO17
    rx_pin: GPIO16
    baud_rate: 9600

pcf8574:
  - id: inputs
    address: 0x22
  - id: outputs
    address: 0x24

# --------------------------------------------------------------------
# Digital inputs (6 dry-contact inputs on the board)
# --------------------------------------------------------------------
binary_sensor:
  - platform: gpio
    name: "Input 1"
    pin: { pcf8574: inputs, number: 0, mode: INPUT, inverted: true }
  - platform: gpio
    name: "Input 2"
    pin: { pcf8574: inputs, number: 1, mode: INPUT, inverted: true }
  - platform: gpio
    name: "Input 3"
    pin: { pcf8574: inputs, number: 2, mode: INPUT, inverted: true }
  - platform: gpio
    name: "Input 4"
    pin: { pcf8574: inputs, number: 3, mode: INPUT, inverted: true }
  - platform: gpio
    name: "Input 5"
    pin: { pcf8574: inputs, number: 4, mode: INPUT, inverted: true }
  - platform: gpio
    name: "Input 6"
    pin: { pcf8574: inputs, number: 5, mode: INPUT, inverted: true }

# --------------------------------------------------------------------
# Relays — requirement 1 (MQTT on/off) + bonus 2 (toggle).
# Controlled via ${mqtt_prefix}/cmd/relay/<n>/{toggle,on,off} (see mqtt.on_message
# above). state_topic below overrides ESPHome's default per-entity topic so
# status publishes to ${mqtt_prefix}/state/relay/<n>/status instead.
# --------------------------------------------------------------------
switch:
  - platform: gpio
    name: "Relay 1"
    id: relay_1
    pin: { pcf8574: outputs, number: 0, mode: OUTPUT, inverted: true }
    restore_mode: RESTORE_DEFAULT_OFF
    state_topic: ${mqtt_prefix}/state/relay/1/status
  - platform: gpio
    name: "Relay 2"
    id: relay_2
    pin: { pcf8574: outputs, number: 1, mode: OUTPUT, inverted: true }
    restore_mode: RESTORE_DEFAULT_OFF
    state_topic: ${mqtt_prefix}/state/relay/2/status
  - platform: gpio
    name: "Relay 3"
    id: relay_3
    pin: { pcf8574: outputs, number: 2, mode: OUTPUT, inverted: true }
    restore_mode: RESTORE_DEFAULT_OFF
    state_topic: ${mqtt_prefix}/state/relay/3/status
  - platform: gpio
    name: "Relay 4"
    id: relay_4
    pin: { pcf8574: outputs, number: 3, mode: OUTPUT, inverted: true }
    restore_mode: RESTORE_DEFAULT_OFF
    state_topic: ${mqtt_prefix}/state/relay/4/status
  - platform: gpio
    name: "Relay 5"
    id: relay_5
    pin: { pcf8574: outputs, number: 4, mode: OUTPUT, inverted: true }
    restore_mode: RESTORE_DEFAULT_OFF
    state_topic: ${mqtt_prefix}/state/relay/5/status
  - platform: gpio
    name: "Relay 6"
    id: relay_6
    pin: { pcf8574: outputs, number: 5, mode: OUTPUT, inverted: true }
    restore_mode: RESTORE_DEFAULT_OFF
    state_topic: ${mqtt_prefix}/state/relay/6/status

  # Per-relay "schedule enabled" toggle (bonus 1). Controlled via
  # ${mqtt_prefix}/cmd/relay/<n>/sched_enable, state mirrored to
  # ${mqtt_prefix}/state/relay/<n>/sched_enable.
  - platform: template
    name: "Relay 1 Schedule Enable"
    id: sched_enable_1
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    state_topic: ${mqtt_prefix}/state/relay/1/sched_enable
  - platform: template
    name: "Relay 2 Schedule Enable"
    id: sched_enable_2
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    state_topic: ${mqtt_prefix}/state/relay/2/sched_enable
  - platform: template
    name: "Relay 3 Schedule Enable"
    id: sched_enable_3
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    state_topic: ${mqtt_prefix}/state/relay/3/sched_enable
  - platform: template
    name: "Relay 4 Schedule Enable"
    id: sched_enable_4
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    state_topic: ${mqtt_prefix}/state/relay/4/sched_enable
  - platform: template
    name: "Relay 5 Schedule Enable"
    id: sched_enable_5
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    state_topic: ${mqtt_prefix}/state/relay/5/sched_enable
  - platform: template
    name: "Relay 6 Schedule Enable"
    id: sched_enable_6
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    state_topic: ${mqtt_prefix}/state/relay/6/sched_enable

# --------------------------------------------------------------------
# Per-relay ON/OFF schedule times (bonus 1) — stored as "minutes since
# midnight" (0-1439). -1 disables that edge. Settable from the web
# dashboard / mobile app via:
#   ${mqtt_prefix}/cmd/relay/<n>/on_time   <-- e.g. "420"  (07:00)
#   ${mqtt_prefix}/cmd/relay/<n>/off_time  <-- e.g. "1080" (18:00)
# state_topic overrides publish to ${mqtt_prefix}/state/relay/<n>/on_time
# and .../off_time instead of ESPHome's default per-entity topic.
# --------------------------------------------------------------------
number:
  - platform: template
    name: "Relay 1 On Time"
    id: on_time_1
    min_value: -1
    max_value: 1439
    step: 1
    initial_value: -1
    optimistic: true
    restore_value: true
    state_topic: ${mqtt_prefix}/state/relay/1/on_time
  - platform: template
    name: "Relay 1 Off Time"
    id: off_time_1
    min_value: -1
    max_value: 1439
    step: 1
    initial_value: -1
    optimistic: true
    restore_value: true
    state_topic: ${mqtt_prefix}/state/relay/1/off_time

  - platform: template
    name: "Relay 2 On Time"
    id: on_time_2
    min_value: -1
    max_value: 1439
    step: 1
    initial_value: -1
    optimistic: true
    restore_value: true
    state_topic: ${mqtt_prefix}/state/relay/2/on_time
  - platform: template
    name: "Relay 2 Off Time"
    id: off_time_2
    min_value: -1
    max_value: 1439
    step: 1
    initial_value: -1
    optimistic: true
    restore_value: true
    state_topic: ${mqtt_prefix}/state/relay/2/off_time

  - platform: template
    name: "Relay 3 On Time"
    id: on_time_3
    min_value: -1
    max_value: 1439
    step: 1
    initial_value: -1
    optimistic: true
    restore_value: true
    state_topic: ${mqtt_prefix}/state/relay/3/on_time
  - platform: template
    name: "Relay 3 Off Time"
    id: off_time_3
    min_value: -1
    max_value: 1439
    step: 1
    initial_value: -1
    optimistic: true
    restore_value: true
    state_topic: ${mqtt_prefix}/state/relay/3/off_time

  - platform: template
    name: "Relay 4 On Time"
    id: on_time_4
    min_value: -1
    max_value: 1439
    step: 1
    initial_value: -1
    optimistic: true
    restore_value: true
    state_topic: ${mqtt_prefix}/state/relay/4/on_time
  - platform: template
    name: "Relay 4 Off Time"
    id: off_time_4
    min_value: -1
    max_value: 1439
    step: 1
    initial_value: -1
    optimistic: true
    restore_value: true
    state_topic: ${mqtt_prefix}/state/relay/4/off_time

  - platform: template
    name: "Relay 5 On Time"
    id: on_time_5
    min_value: -1
    max_value: 1439
    step: 1
    initial_value: -1
    optimistic: true
    restore_value: true
    state_topic: ${mqtt_prefix}/state/relay/5/on_time
  - platform: template
    name: "Relay 5 Off Time"
    id: off_time_5
    min_value: -1
    max_value: 1439
    step: 1
    initial_value: -1
    optimistic: true
    restore_value: true
    state_topic: ${mqtt_prefix}/state/relay/5/off_time

  - platform: template
    name: "Relay 6 On Time"
    id: on_time_6
    min_value: -1
    max_value: 1439
    step: 1
    initial_value: -1
    optimistic: true
    restore_value: true
    state_topic: ${mqtt_prefix}/state/relay/6/on_time
  - platform: template
    name: "Relay 6 Off Time"
    id: off_time_6
    min_value: -1
