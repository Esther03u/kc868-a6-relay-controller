    step: 1
    initial_value: -1
    optimistic: true
    restore_value: true
    state_topic: ${mqtt_prefix}/state/relay/6/off_time

# --------------------------------------------------------------------
# Scheduler — checks every 30s whether "now" matches a configured
# on/off minute-of-day for each relay whose schedule is enabled.
# --------------------------------------------------------------------
interval:
  - interval: 30s
    then:
      - lambda: |-
          if (!id(sntp_time).now().is_valid()) return;
          auto now = id(sntp_time).now();
          int minutes = now.hour * 60 + now.minute;

          struct Ch { switch_::Switch *relay; switch_::Switch *enable;
                      number::Number *on_t; number::Number *off_t; };
          Ch channels[6] = {
            { id(relay_1), id(sched_enable_1), id(on_time_1), id(off_time_1) },
            { id(relay_2), id(sched_enable_2), id(on_time_2), id(off_time_2) },
            { id(relay_3), id(sched_enable_3), id(on_time_3), id(off_time_3) },
            { id(relay_4), id(sched_enable_4), id(on_time_4), id(off_time_4) },
            { id(relay_5), id(sched_enable_5), id(on_time_5), id(off_time_5) },
            { id(relay_6), id(sched_enable_6), id(on_time_6), id(off_time_6) },
          };

          for (auto &c : channels) {
            if (!c.enable->state) continue;
            int on_m = (int) c.on_t->state;
            int off_m = (int) c.off_t->state;
            if (on_m >= 0 && minutes == on_m && !c.relay->state) c.relay->turn_on();
            if (off_m >= 0 && minutes == off_m && c.relay->state) c.relay->turn_off();
          }
