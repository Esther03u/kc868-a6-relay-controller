# Mosquitto broker config for the KC868-A6 project.
# Exposes both classic MQTT (1883, used by the ESP32 board) and
# MQTT-over-WebSocket (9001, used by the browser/PWA dashboard).

listener 1883
protocol mqtt

listener 9001
protocol websockets

# Authentication (recommended). Generate the password file with:
#   docker run -it --rm -v %cd%/mosquitto:/mosquitto/config eclipse-mosquitto \
#     mosquitto_passwd -c /mosquitto/config/passwd kc868
password_file /mosquitto/config/passwd
allow_anonymous false

persistence true
persistence_location /mosquitto/data/
log_dest stdout
